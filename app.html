<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>ECE Quest Pro | Engineering Learning Platform</title>
  <meta name="description" content="ECE Quest Pro - Interactive engineering learning platform with real-time circuit labs, quizzes, and formula reference.">
  
  <!-- Modern Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="app-logo.png">
</head>
<body>

  <!-- App Header (Hidden until login) -->
  <header class="app-header" style="display: none;">
    <div class="brand-section" id="brand-home-btn">
      <div class="brand-logo-icon">
        <img src="app-logo.png" alt="ECE" class="brand-logo-img">
      </div>
      <div class="brand-text">
        <span class="brand-title">ECE QUEST</span>
        <span class="brand-edition">PRO</span>
      </div>
    </div>

    <div class="header-stats">
      <div class="stat-pill stat-level">
        <span class="pill-dot"></span>
        <span class="label">LVL</span>
        <span class="value" id="hdr-level">1</span>
      </div>
      <div class="stat-pill stat-xp">
        <span class="label">XP</span>
        <span class="value" id="hdr-xp">0</span>
      </div>
      <div class="stat-pill stat-streak">
        <span class="label">STREAK</span>
        <span class="value" id="hdr-streak">0</span>
      </div>
      <button class="nav-pill-btn" id="nav-home-btn" title="Home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Dynamic View Container -->
  <main class="main-container" id="app-view">
    <!-- Dynamic app views rendered here -->
  </main>

  <!-- Mobile App Bottom Navigation Bar (Hidden until login) -->
  <nav class="app-bottom-nav" id="mobile-nav" style="display: none;">
    <button class="nav-tab active" id="tab-home">
      <svg class="tab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span class="tab-label">Home</span>
    </button>
    <button class="nav-tab" id="tab-quiz">
      <svg class="tab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
      </svg>
      <span class="tab-label">Quiz</span>
    </button>
    <button class="nav-tab" id="tab-learn">
      <svg class="tab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span class="tab-label">Learn</span>
    </button>
    <button class="nav-tab" id="tab-lab">
      <svg class="tab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 2v7.31L4 20h16l-6-10.69V2h-4z"></path>
        <line x1="8.5" y1="2" x2="15.5" y2="2"></line>
      </svg>
      <span class="tab-label">Lab</span>
    </button>
    <button class="nav-tab" id="tab-profile">
      <svg class="tab-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span class="tab-label">Profile</span>
    </button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
